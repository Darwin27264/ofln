name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm test -- --forceExit

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle properties (CI, no secrets)
        run: |
          cp android/gradle.properties.example android/gradle.properties
          # Strip signing placeholders so debug assemble does not look for a keystore
          sed -i '/^MYAPP_UPLOAD_/d' android/gradle.properties
      - run: npm ci
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS compile (Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CocoaPods
        working-directory: ios
        run: |
          bundle install || true
          bundle exec pod install || pod install
      - name: xcodebuild (no signing)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ofln.xcworkspace \
            -scheme ofln \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build
