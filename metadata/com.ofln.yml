AutoName: ofln
Summary: Private AI that runs fully offline on your phone
Description: |-
  A private AI that runs fully offline on your phone, with no account and no cloud.
  Executes open-weights GGUF models directly on device using llama.cpp via llama.rn.

  Features:
  * 100% Offline: Prompts, chats, and weights remain on your device.
  * Curated Starter Shelf: Verified Q4_0 quantized models tailored to phone RAM limits.
  * Personas & Perspective Debates: Create custom system prompts or pit AI personas against each other in structured debates.
  * Source Monitor: Periodic on-device content analysis of saved web sources and feeds.
  * Share Sheet & Quick Actions: Highlight text in any app to summarize, rewrite, translate, or ask ofln directly.
  * No Trackers, No Cloud, No Telemetry.

